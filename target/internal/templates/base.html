<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Grizzy Admin{% endblock %} - Grizzy's Internal Dashboard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f4f4f4;color:#333}
.sidebar{width:200px;background:#2c3e50;position:fixed;top:0;left:0;bottom:0;padding-top:20px}
.sidebar .brand{color:#ecf0f1;font-size:1rem;font-weight:bold;padding:0 16px 20px;border-bottom:1px solid #3d5166}
.sidebar a{display:block;color:#bdc3c7;padding:10px 16px;font-size:0.9rem;text-decoration:none}
.sidebar a:hover,.sidebar a.active{background:#3d5166;color:#fff}
.main{margin-left:200px;padding:24px}
.topbar{background:#fff;border-bottom:1px solid #ddd;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;margin:-24px -24px 24px}
.topbar h1{font-size:1.1rem}
.topbar a{color:#e74c3c;font-size:0.85rem}
.card{background:#fff;border:1px solid #ddd;border-radius:6px;padding:20px;margin-bottom:20px}
.card h2{font-size:1rem;margin-bottom:14px;color:#555;border-bottom:1px solid #eee;padding-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:#fff;border:1px solid #ddd;border-radius:6px;padding:16px;text-align:center}
.stat .num{font-size:2rem;font-weight:bold;color:#2c3e50}
.stat .label{font-size:0.8rem;color:#888;margin-top:4px}
table{width:100%;border-collapse:collapse}
table th,table td{padding:8px 12px;text-align:left;border-bottom:1px solid #eee;font-size:0.88rem}
table th{background:#f9f9f9;font-weight:600;text-transform:uppercase;font-size:0.78rem;letter-spacing:0.03em}
.btn{display:inline-block;padding:6px 14px;border:none;border-radius:4px;cursor:pointer;font-size:0.85rem;text-decoration:none}
.btn-primary{background:#3498db;color:#fff}
.btn-danger{background:#e74c3c;color:#fff}
.btn-success{background:#27ae60;color:#fff}
.btn-sm{padding:4px 10px;font-size:0.8rem}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:0.75rem;font-weight:bold}
.badge-pending{background:#fff3cd;color:#856404}
.badge-processing{background:#d1ecf1;color:#0c5460}
.badge-shipped{background:#cce5ff;color:#004085}
.badge-delivered{background:#d4edda;color:#155724}
.alert{padding:10px 14px;border-radius:4px;margin-bottom:14px;font-size:0.88rem}
.alert-success{background:#d4edda;color:#155724}
.alert-error{background:#f8d7da;color:#721c24}
input[type=text],input[type=password],select,textarea{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px;font-size:0.9rem}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:4px;font-size:0.85rem;color:#555}
</style>
</head>
<body>
<div class="sidebar">
  <div class="brand">🍽 Grizzy Admin</div>
  <a href="/">Dashboard</a>
  <a href="/orders">Orders</a>
  <a href="/users">Customers</a>
  <a href="/export">Export Data</a>
  <a href="/webhook">Webhook Test</a>
  <a href="/logout" style="margin-top:auto;position:absolute;bottom:20px;width:100%">Log Out</a>
</div>
<div class="main">
  <div class="topbar">
    <h1>{% block heading %}Dashboard{% endblock %}</h1>
    <a href="/logout">Log out</a>
  </div>
  {% block content %}{% endblock %}
</div>
</body>
</html>
