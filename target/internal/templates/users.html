{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block heading %}Customers{% endblock %}
{% block content %}
<div class="card">
  <table>
    <thead>
      <tr><th>ID</th><th>Username</th><th>Email</th><th>Joined</th></tr>
    </thead>
    <tbody>
      {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.email }}</td>
        <td>{{ u.created_at.strftime('%d %b %Y') }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
