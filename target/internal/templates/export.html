{% extends "base.html" %}
{% block title %}Export{% endblock %}
{% block heading %}Export Orders{% endblock %}
{% block content %}
<div class="card" style="max-width:500px">
  <h2>Export to CSV</h2>
  {% if message %}<div class="alert alert-success">{{ message }}</div>{% endif %}
  <p style="font-size:0.88rem;color:#666;margin-bottom:16px">Export order data to a CSV file on the server. Enter a filename (without extension).</p>
  <form method="post">
    <div class="form-group">
      <label>Output filename</label>
      <input type="text" name="filename" value="orders_export" placeholder="orders_export">
    </div>
    <button type="submit" class="btn btn-primary">Run Export</button>
  </form>
</div>
{% endblock %}
