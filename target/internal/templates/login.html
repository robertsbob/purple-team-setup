<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login - Grizzy Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#2c3e50;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{background:#fff;border-radius:8px;padding:32px;width:320px}
h1{font-size:1.2rem;margin-bottom:20px;color:#2c3e50}
.form-group{margin-bottom:14px}
label{display:block;margin-bottom:4px;font-size:0.85rem;color:#555}
input{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:4px}
.btn{width:100%;padding:10px;background:#e67e22;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:0.95rem;margin-top:4px}
.error{color:#e74c3c;font-size:0.85rem;margin-bottom:12px}
.brand{text-align:center;font-size:0.8rem;color:#888;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <h1>🍽 Grizzy's Internal Dashboard</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" required autofocus>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" required>
    </div>
    <button type="submit" class="btn">Log In</button>
  </form>
  <p class="brand">Internal use only. Grizzy's Gourmet Grub Ltd.</p>
</div>
</body>
</html>
