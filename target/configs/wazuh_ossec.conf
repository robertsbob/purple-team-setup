<ossec_config>
  <client>
    <server>
      <address>WAZUH_SERVER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu, ubuntu22</config-profile>
    <notify_time>60</notify_time>
    <time-reconnect>300</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- File integrity monitoring -->
  <syscheck>
    <frequency>300</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>

    <!-- Monitor web root for changes -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/var/www/grizzy/public</directories>
    <directories check_all="yes" realtime="yes">/opt/grizzy</directories>
    <directories check_all="yes" realtime="yes">/etc/nginx</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.d</directories>
    <directories check_all="yes">/etc/passwd</directories>
    <directories check_all="yes">/etc/shadow</directories>
    <directories check_all="yes">/etc/sudoers</directories>
    <directories check_all="yes">/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes">/tmp</directories>
    <directories check_all="yes">/usr/local/bin</directories>
    <directories check_all="yes">/home</directories>
    <directories check_all="yes">/root</directories>

    <!-- Ignore volatile files -->
    <ignore>/var/www/grizzy/public/uploads</ignore>
    <ignore>/tmp/sess_</ignore>
  </syscheck>

  <!-- Log collection -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/grizzy_access.log</location>
    <label key="service">nginx-grizzy</label>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/grizzy_error.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/mysql/error.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/vsftpd.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/redis/redis-server.log</location>
  </localfile>

  <!-- Process monitoring -->
  <localfile>
    <log_format>command</log_format>
    <command>ps -aux</command>
    <frequency>120</frequency>
  </localfile>

  <localfile>
    <log_format>command</log_format>
    <command>netstat -tlnp</command>
    <frequency>300</frequency>
  </localfile>

  <!-- Rootcheck -->
  <rootcheck>
    <frequency>3600</frequency>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
  </rootcheck>

  <!-- Active response - disabled to avoid interfering with exercise -->
  <!-- <active-response><disabled>yes</disabled></active-response> -->

</ossec_config>
