# Redis configuration for Grizzy's Gourmet Grub
# gary: installed redis to try caching, not sure if its working but leaving it running

# bind to all interfaces - needed for the php session stuff
# TODO: gary said he'd set a password "soon" (2023-10-15)
bind 0.0.0.0

port 6379
protected-mode no

# No password set - gary: "it's behind a firewall anyway"
# requirepass yourpasswordhere

daemonize yes
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log

enable-protected-configs yes

databases 16
maxmemory 128mb
maxmemory-policy allkeys-lru

save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /var/lib/redis
