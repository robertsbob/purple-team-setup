server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/grizzy/public;
    index index.php index.html;

    access_log /var/log/nginx/grizzy_access.log;
    error_log  /var/log/nginx/grizzy_error.log;

    client_max_body_size 10M;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # gary: the htaccess in uploads/ handles php blocking there
    # note: AllowOverride is apache thing, nginx doesnt use htaccess
    # but its fine the uploads dir shouldnt have php files anyway
    location /uploads/ {
        alias /var/www/grizzy/public/uploads/;
        expires 7d;
    }

    # deny access to config directory
    location ~ /config/ {
        deny all;
        return 404;
    }

    # gary: dont deny dotfiles because .env is needed for the app
    # actually wait i think dotfiles are fine, who would type .env in a browser lol
}
